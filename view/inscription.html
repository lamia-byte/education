<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Aokas Language School</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="auth.css">

    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
</head>

<body>


   <main>

    <section class="auth-page login-only">

        <section class="auth-card" aria-labelledby="register-title">

            <div class="auth-card-header">

                <h2 id="register-title">Créer un compte</h2>

                <p>
                    Rejoignez Aokas Language School et commencez votre apprentissage.
                </p>

            </div>

            <form class="auth-form" id="registerForm" novalidate>

                <div class="form-row">

                    <div class="input-group">

                        <label for="firstName">Prénom</label>

                        <div class="input-control">

                            <i class="fa-regular fa-user"></i>

                            <input
                                id="firstName"
                                type="text"
                                name="firstName"
                                placeholder="Votre prénom"
                                required>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="lastName">Nom</label>

                        <div class="input-control">

                            <i class="fa-regular fa-user"></i>

                            <input
                                id="lastName"
                                type="text"
                                name="lastName"
                                placeholder="Votre nom"
                                required>

                        </div>

                    </div>

                </div>

                <div class="input-group">

                    <label for="registerEmail">Adresse e-mail</label>

                    <div class="input-control">

                        <i class="fa-regular fa-envelope"></i>

                        <input
                            id="registerEmail"
                            type="email"
                            name="email"
                            placeholder="votre@email.com"
                            required>

                    </div>

                </div>

                <div class="form-row">

                    <div class="input-group">

                        <label for="phone">Téléphone</label>

                        <div class="input-control">

                            <i class="fa-solid fa-phone"></i>

                            <input
                                id="phone"
                                type="tel"
                                name="phone"
                                placeholder="+213..."
                                required>

                        </div>

                    </div>

                    <div class="input-group">

                        <label for="language">Langue</label>

                        <div class="input-control">

                            <i class="fa-solid fa-language"></i>

                            <select id="language" name="language">

                                <option value="">Choisir une langue</option>

                                <option>Anglais</option>

                                <option>Français</option>

                                <option>Espagnol</option>

                                <option>Allemand</option>

                                <option>Italien</option>

                                <option>Turc</option>

                            </select>

                        </div>

                    </div>

                </div>

                <div class="input-group">

                    <label for="registerPassword">Mot de passe</label>

                    <div class="input-control">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="registerPassword"
                            type="password"
                            name="password"
                            placeholder="Minimum 6 caractères"
                            required>

                        <button
                            class="password-toggle"
                            type="button">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <div class="input-group">

                    <label for="confirmPassword">
                        Confirmer le mot de passe
                    </label>

                    <div class="input-control">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            id="confirmPassword"
                            type="password"
                            name="confirmPassword"
                            placeholder="Répétez votre mot de passe"
                            required>

                        <button
                            class="password-toggle"
                            type="button">

                            <i class="fa-regular fa-eye"></i>

                        </button>

                    </div>

                </div>

                <label class="terms-check">

                    <input type="checkbox" required>

                    <span>
                        J'accepte les conditions générales d'utilisation.
                    </span>

                </label>

                <button
                    type="submit"
                    class="auth-submit">

                    Créer mon compte

                </button>

                <p class="auth-message"></p>

            </form>

            <p class="auth-switch">

                Vous avez déjà un compte ?

                <a href="login.html">

                    Se connecter

                </a>

            </p>

        </section>

    </section>

</main>


</body>
</html>
